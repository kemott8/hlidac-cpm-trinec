name: Hlídač CPM Třinec

on:
  schedule:
    # Každých 15 minut (UTC). GitHub může běh o pár minut zpozdit.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Poslat zkušební notifikaci"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hlidac-cpm-trinec
  cancel-in-progress: false

jobs:
  kontrola:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Kontrola webu
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_EMAIL: ${{ secrets.NTFY_EMAIL }}
          TEST_NOTIFY: ${{ inputs.test_notification }}
        run: python3 hlidac.py

      - name: Uložit stav
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Stav hlídače $(TZ=Europe/Prague date '+%F %H:%M')"
            git pull --rebase --quiet && git push --quiet
          fi
